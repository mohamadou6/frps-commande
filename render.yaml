databases:
  - name: frps-commande-db
    plan: free
    databaseName: frps_commande
    user: frps_user

services:
  - type: web
    name: frps-commande
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ensure_admin"
    startCommand: "gunicorn frps_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frps-commande-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "frps-commande.onrender.com"
      - key: STOCK_CONNECTOR_BACKEND
        value: "mock"
      - key: PAYMENT_GATEWAY
        value: "mock"
      - key: WHATSAPP_BACKEND
        value: "log"
      - key: SMS_BACKEND
        value: "twilio"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://frps-commande.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
