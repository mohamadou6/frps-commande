<a href="{% url 'commandes:telecharger_pdf_staff' commande.id %}" class="btn btn-sm btn-outline-secondary" title="Bon de commande (PDF)">PDF</a>
{% if peut_avancer and commande.etape_suivante %}
<form method="post" action="{% url 'commandes:avancer_etape' commande.id %}" class="d-inline-flex flex-grow-1 flex-md-grow-0">
    {% csrf_token %}
    <input type="hidden" name="etape" value="{{ commande.etape_suivante }}">
    <input type="hidden" name="suivant" value="{{ request.get_full_path }}">
    <button type="submit" class="btn btn-sm btn-primary w-100">→ {{ commande.etape_suivante_libelle }}</button>
</form>
{% endif %}
