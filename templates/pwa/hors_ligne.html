{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f9d58">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <title>Hors connexion - FRPS Nord en Ligne</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(160deg, #0b7a45 0%, #12925a 55%, #17a768 100%);
            color: #163;
        }
        .carte {
            background: #fff;
            border-radius: 18px;
            padding: 2rem 1.5rem;
            max-width: 26rem;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .22);
        }
        img { width: 96px; height: 96px; }
        h1 { font-size: 1.25rem; color: #0b7a45; margin: 1rem 0 .5rem; }
        p { color: #444; line-height: 1.5; margin: 0 0 1rem; }
        button {
            background: #12925a;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: .7rem 1.4rem;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="carte">
    <img src="{% static 'img/icon-192.png' %}" alt="FRPS Nord">
    <h1>Pas de connexion</h1>
    <p>
        Cette page n'a pas encore été consultée sur ce téléphone, elle ne peut donc
        pas s'afficher hors connexion.
    </p>
    <p>
        Les pages déjà ouvertes au moins une fois, dont le catalogue, restent
        accessibles sans réseau.
    </p>
    <button onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
